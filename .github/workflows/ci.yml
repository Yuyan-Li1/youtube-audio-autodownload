name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["*"]
    # Only run on push to PR branches (not main directly, since PRs handle that)
    # This ensures CI runs on every commit pushed to a PR

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the minimum supported version (see pyproject.toml);
        # 3.14 is what the downloader runs on in production.
        python-version: ["3.12", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run ruff linting
        run: |
          ruff check .

      - name: Run ruff format check
        run: |
          ruff format --check .

      - name: Run mypy type checking
        run: |
          mypy .

      - name: Run tests with coverage
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        # One upload is enough; coverage does not differ between versions.
        if: always() && matrix.python-version == '3.14'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true
